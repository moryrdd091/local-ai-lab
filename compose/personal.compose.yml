services:
  open-webui-personal:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui-personal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data/open-webui-personal:/app/backend/data
